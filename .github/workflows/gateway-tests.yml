name: Test Device Mesh Coordinator

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/gateway-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Check Python syntax
        run: python -m compileall -q gateway tests
      - name: Run API and node configuration tests
        run: python -m pytest -q tests
